<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>顺序自动播放示例</title>
</head>
<body>
  <video
    id="player"
    controls
    autoplay
    style="min-width:640px;min-height:360px;"
></video>
<script>
(function() {
    const playlist = [
    'RealRecon_demo_1.mp4',
    'RealRecon_demo_2.mp4',
    'RealRecon_demo_3.mp4',
    ];
    const player = document.getElementById('player');
    let idx = 0;

    // 播放第一条
    player.src = playlist[idx];
    player.play();

    player.addEventListener('ended', () => {
    idx++;
    if (idx < playlist.length) {
        player.src = playlist[idx];
        player.play();
    }
    });
})();
</script>
</body>
</html>



<style>
  .container {
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
  }
  .video-container {
    min-width: 640px;
    min-height: 360px;
    background: #000;
  }
  .video-container video {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  ul#videolist {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  ul#videolist li {
    padding: 0.5rem 0.1rem;
    cursor: pointer;
    border-radius: 0.1rem;
  }
  ul#videolist li.active {
    background: #eef;
    font-weight: bold;
  }
  ul#videolist li:hover {
    background: #f5f5f5;
  }
</style>

<div class="container">
  <!-- 视频播放区 -->
  <div class="video-container">
    <video id="player" src="assets/RealRecon_demo_1.mp4" controls muted playsinline></video>
  </div>

  <!-- 点击切换播放的视频列表 -->
  <ul id="videolist">
    <li data-src="https://youtu.be/t4Y_ba83do0" class="active">Demo_1</li>
    <li data-src="https://youtu.be/bxgGxpoeJQk">Demo_2</li>
    <li data-src="https://youtu.be/fvawxgCCN40">Demo_3</li>
  </ul>
</div>

<script>
  const player = document.getElementById('player');
  const list   = document.getElementById('videolist');

  list.addEventListener('click', e => {
    if (e.target.tagName.toLowerCase() !== 'li') return;
    // 切换列表高亮
    list.querySelectorAll('li').forEach(li => li.classList.remove('active'));
    e.target.classList.add('active');
    // 切换视频源并播放
    const src = e.target.getAttribute('data-src');
    if (player.src.endsWith(src)) return; // 已是当前视频则不重复加载
    player.src = src;
    player.play();
  });
</script>
